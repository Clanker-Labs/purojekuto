<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>purojekuto · offline</title>
    <style>
      :root { color-scheme: dark light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f1419; color: #e8edf2;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: light) { body { background: #f4f6f8; color: #0f1419; } p { color: #3d4853 !important; } }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p { color: #a8b3bf; margin: 0 0 20px; max-width: 32ch; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; background: #00d4aa; color: #0f1419; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>purojekuto can't reach home</h1>
      <p>Your calendar lives on your own server. Check that this device is on the tailnet, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
